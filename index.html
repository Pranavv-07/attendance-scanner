<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Aditya University Attendance Scanner system</title>
  
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>

    :root {
      --th-dark-green: #114A8E;
      --th-light-green: #EC632A;
  
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background-color: #BDB7B5;
    }

  
    header {
      background-color: var(--th-dark-green);
      color: white;
      padding: 15px 0;
      border-bottom: 5px solid var(--th-gold);
      margin-bottom: 25px;
    }

    h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 1px;
    }

    /* Scanner Border */
    #reader {
      width: 300px;
      margin: auto;
      border: 2px solid var(--th-light-green);
    }

    /* Simple Flat Button */
    button {
      margin-top: 20px;
      padding: 12px 30px;
      font-size: 16px;
      background-color: var(--th-dark-green);
      color: white;
      border: none;
      font-weight: bold;
    }

    /* Clean Table Styling */
    table {
      margin: 30px auto;
      border-collapse: collapse;
      width: 90%;
      max-width: 500px;
    }

    th {
      border: 1px solid var(--th-dark-green);
      background-color: #f9f9f9;
      color: var(--th-dark-green);
      padding: 10px;
    }

    td {
      border: 1px solid #dddddd;
      padding: 10px;
      font-size: 14px;
    }

    .scanned-id {
      color: var(--th-dark-green);
      font-weight: bold;
    }
    .footer {
  background-color: #EC632A;
  color: #fff;
  text-align: center;
  padding: 12px 0;
  position: fixed;
  bottom: 0;
  width: 100%;
  font-size: 14px;
}
    
  </style>
</head>
<footer class="footer">
  <p>© 2025 Aditya University all Rights Resereved </p>
</footer>
<body>

  <header>
    <h2>Aditya University Attendance Scanner System</h2>
  </header>

  <div id="reader"></div>

  <button onclick="downloadExcel()">⬇ Download Excel file</button>

  <table>
    <thead>
      <tr>
        <th>Scanned ID</th>
        <th>Date</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody id="attendance-body">
      </tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
