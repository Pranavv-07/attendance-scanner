<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aditya University Attendance Scanner System</title>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>

  <style>
    :root {
      --dark-blue: #114A8E;
      --bright-orange: #EC632A;
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      background-color: #BDB7B5;
      padding-bottom: 80px; 
    }

    header {
      background-color: var(--dark-blue);
      color: white;
      padding: 15px 0;
      border-bottom: 5px solid var(--bright-orange);
      margin-bottom: 25px;
    }

    #reader {
      width: 300px;
      margin: auto;
      border: 2px solid var(--bright-orange);
    }

    input {
      padding: 10px;
      font-size: 14px;
    }

    button {
      margin-top: 15px;
      padding: 12px 30px;
      font-size: 16px;
      background-color: var(--dark-blue);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      position: relative;
      z-index: 20; 
    }

    table {
      margin: 30px auto;
      border-collapse: collapse;
      width: 90%;
      max-width: 500px;
      background: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      font-size: 14px;
    }

    th {
      background: #f9f9f9;
      color: var(--dark-blue);
    }

    .footer {
      background-color: var(--bright-orange);
      color: #fff;
      text-align: center;
      padding: 12px 0;
      position: fixed;
      bottom: 0;
      width: 100%;
      font-size: 14px;
      z-index: 10;
    }

  
    @media (max-width: 768px) {
      .footer {
        position: static;
      }
    }
  </style>
</head>

<body>

  <header>
    <h2>Aditya University Attendance Scanner System</h2>
  </header>

  <div id="reader"></div>

  <div style="margin-top: 15px;">
    <input
      type="text"
      id="manualRoll"
      placeholder="Enter Roll No manually"
    >
    <br>
    <button onclick="addManualEntry()">Add Roll No</button>
  </div>

  <button onclick="downloadExcel()">⬇ Download Excel file</button>

  <table>
    <thead>
      <tr>
        <th>Roll No</th>
        <th>Date</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody id="attendance-body"></tbody>
  </table>

  <footer class="footer">
    <p>© 2025 Aditya University | All Rights Reserved | PV</p>
  </footer>


  <script src="script.js"></script>

</body>
</html>
