<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Scanner (iOS Safe + Beep)</title>

  <!-- html5-qrcode -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    #reader {
      width: 300px;
      margin: 20px auto;
      border: 3px solid #0f9d58;
      border-radius: 10px;
      background: #000;
    }

    #result {
      margin: 15px 0;
      font-size: 16px;
      color: #0f9d58;
      word-break: break-word;
    }

    button {
      padding: 10px 20px;
      margin: 8px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .start-btn {
      background: #0f9d58;
      color: #fff;
    }

    .restart-btn {
      background: #1a73e8;
      color: #fff;
    }
  </style>
</head>

<body>

  <h1>QR Code Scanner</h1>

  <div id="reader"></div>

  <p id="result">Scan a QR code</p>

  <button class="start-btn" onclick="startScanner()">Start Scanner</button>
  <button class="restart-btn" onclick="restartScanner()">Scan Again</button>

  <!-- Hidden beep sound -->
  <audio id="beep" preload="auto">
    <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
    <source src="https://actions.google.com/sounds/v1/alarms/beep_short.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>

</body>
</html>
